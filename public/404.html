<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Page Not Found</title>
        <link rel="stylesheet" />

        <style>
            @font-face {
                font-family: "montserrat";
                src: url("../src/assets/fonts/montserrat.ttf")
                    format("truetype");
            }
            @font-face {
                font-family: "garet";
                src: url("../src/assets/fonts/garet.woff2") format("woff2");
            }

            :root {
                /* Fonts */
                --font-garet: "garet", sans-serif;
                --font-montserrat: "montserrat", sans-serif;

                /* Backgrounds */
                --color-background: #000000;
                --color-surface: #18181b;

                /* Text */
                --color-text: #ffffff;
                --color-text-secondary: #e9bb67;
                --color-text-gray: #ada18b;

                /* Borders */   
                --color-border: #808080;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-garet);
                background: var(--color-background);
                color: var(--color-text);
            }

            .container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            }

            .content {
                max-width: 600px;
                text-align: center;
            }

            .error-code {
                font-family: var(--font-montserrat);
                font-size: clamp(5rem, 15vw, 8rem);
                font-weight: 900;
                color: color-mix(
                    in srgb,
                    var(--color-text-secondary) 20%,
                    transparent
                );
            }

            .title {
                margin-top: 2rem;
                font-size: clamp(2rem, 5vw, 2.5rem);
                font-weight: 700;
                color: var(--color-text);
            }

            .description {
                margin-top: 1rem;
                font-size: 1rem;
                line-height: 1.7;
                color: var(--color-text-gray);
            }

            .actions {
                margin-top: 2rem;
                display: flex;
                justify-content: center;
                gap: 1rem;
                flex-wrap: wrap;
            }

            .btn {
                text-decoration: none;
                padding: 0.9rem 1.5rem;
                border-radius: 12px;
                font-weight: 600;
                transition: 0.3s ease;
            }

            .secondary {
                background: var(--color-surface);
                border: 1px solid var(--color-border);
                color: var(--color-text-gray);
            }

            .secondary:hover {
                border-color: var(--color-text-secondary);
                color: var(--color-text-secondary);
            }

            .primary {
                background: var(--color-text-secondary);
                color: var(--color-background);
            }

            .primary:hover {
                opacity: 0.8;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="content">
                <h1 class="error-code">404</h1>

                <h2 class="title">Oops! This page does not exist.</h2>

                <p class="description">
                    The page you are looking for may have been removed, renamed,
                    or never existed.
                </p>

                <div class="actions">
                    <a href="/" class="btn secondary"> Back to Home </a>

                    <a href="/movie" class="btn primary"> Browse Movies </a>
                </div>
            </div>
        </div>
    </body>
</html>
